<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 770" width="1000" height="770" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Liberation Sans", sans-serif'>
<title id="t">Synchro dans les deux sens (Échange)</title><desc id="d">Deux documents ont chacun une table technique Synchro avec un webhook, un formulaire publié et un journal ; le webhook de chacun envoie ses modifications au formulaire de l’autre et le widget recopie le journal dans les tables partagées.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#2f6fed"/></marker>
<marker id="ahd" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#1a3f94"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#5f6b7e"/></marker>
</defs>
<rect width="1000" height="770" fill="#ffffff"/>
<rect x="400" y="20" width="200" height="640" fill="#eef1f6" opacity=".55"/><text x="500" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#5f6b7e">Même instance Grist</text><g><rect x="20" y="20" width="380" height="640" rx="12" fill="#f4f6fa" stroke="#c3cad6" stroke-width="1.5"/>
<text x="38" y="48" font-size="17" font-weight="700" fill="#1b2430">Document A</text>
<text x="38" y="67" font-size="13" fill="#5f6b7e">celui qui invite · widget Sync+ posé</text></g><g><rect x="600" y="20" width="380" height="640" rx="12" fill="#f4f6fa" stroke="#c3cad6" stroke-width="1.5"/>
<text x="618" y="48" font-size="17" font-weight="700" fill="#1b2430">Document B</text>
<text x="618" y="67" font-size="13" fill="#5f6b7e">celui qui accepte · widget Sync+ posé</text></g><g><rect x="40" y="84" width="340" height="96" rx="9" fill="#eef1f6" stroke="#c3cad6" stroke-width="1.4"/><circle cx="64" cy="110" r="12.5" fill="#2f6fed"/><text x="64" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text><text x="86" y="114" font-size="15.5" font-weight="700" fill="#1b2430">Table Synchro + webhook</text><text x="86" y="133" font-size="13" fill="#5f6b7e">à chaque modification faite dans A,</text><text x="86" y="152" font-size="13" fill="#5f6b7e">Grist envoie la ligne vers B</text></g><g><rect x="620" y="84" width="340" height="96" rx="9" fill="#eef1f6" stroke="#c3cad6" stroke-width="1.4"/><circle cx="644" cy="110" r="12.5" fill="#2f6fed"/><text x="644" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text><text x="666" y="114" font-size="15.5" font-weight="700" fill="#1b2430">Formulaire publié + Journal</text><text x="666" y="133" font-size="13" fill="#5f6b7e">reçoit les lignes de A dans le journal</text><text x="666" y="152" font-size="13" fill="#5f6b7e">de B (le formulaire n’accepte que l’ajout)</text></g><g><rect x="40" y="306" width="340" height="92" rx="9" fill="#ffffff" stroke="#c3cad6" stroke-width="1.4"/><text x="56" y="336" font-size="15.5" font-weight="700" fill="#1b2430">Les mêmes tables, des deux côtés</text><text x="56" y="355" font-size="13" fill="#5f6b7e">clé id_sync, heure MajLe, case Supprime</text><text x="56" y="374" font-size="13" fill="#5f6b7e">on peut les modifier dans A comme dans B</text></g><g><rect x="620" y="306" width="340" height="92" rx="9" fill="#ffffff" stroke="#c3cad6" stroke-width="1.4"/><text x="636" y="336" font-size="15.5" font-weight="700" fill="#1b2430">Les mêmes tables, des deux côtés</text><text x="636" y="355" font-size="13" fill="#5f6b7e">clé id_sync, heure MajLe, case Supprime</text><text x="636" y="374" font-size="13" fill="#5f6b7e">on peut les modifier dans B comme dans A</text></g><g><rect x="40" y="530" width="340" height="96" rx="9" fill="#eef1f6" stroke="#c3cad6" stroke-width="1.4"/><circle cx="64" cy="556" r="12.5" fill="#2f6fed"/><text x="64" y="561" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text><text x="86" y="560" font-size="14.5" font-weight="700" fill="#1b2430">Formulaire publié + Journal de retour</text><text x="86" y="579" font-size="13" fill="#5f6b7e">reçoit les lignes de B (ajout seulement)</text><text x="86" y="598" font-size="13" fill="#5f6b7e">dans le journal de retour de A</text></g><g><rect x="620" y="530" width="340" height="96" rx="9" fill="#eef1f6" stroke="#c3cad6" stroke-width="1.4"/><circle cx="644" cy="556" r="12.5" fill="#2f6fed"/><text x="644" y="561" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text><text x="666" y="560" font-size="15.5" font-weight="700" fill="#1b2430">Table Synchro + webhook</text><text x="666" y="579" font-size="13" fill="#5f6b7e">à chaque modification faite dans B,</text><text x="666" y="598" font-size="13" fill="#5f6b7e">Grist renvoie la ligne vers A</text></g><path d="M210 306 L210 180" fill="none" stroke="#2f6fed" stroke-width="2.5"  marker-end="url(#ah)"/><path d="M210 530 L210 398" fill="none" stroke="#2f6fed" stroke-width="2.5"  marker-end="url(#ah)"/><path d="M790 180 L790 306" fill="none" stroke="#2f6fed" stroke-width="2.5"  marker-end="url(#ah)"/><path d="M790 398 L790 530" fill="none" stroke="#2f6fed" stroke-width="2.5"  marker-end="url(#ah)"/><text x="224" y="252" text-anchor="start" font-size="12" font-weight="400" fill="#5f6b7e">formules : automatique</text><text x="224" y="474" text-anchor="start" font-size="12.5" font-weight="700" fill="#2558c4">Widget Sync+ : recopie</text><text x="224" y="491" text-anchor="start" font-size="12" font-weight="400" fill="#5f6b7e">(page ouverte)</text><text x="804" y="244" text-anchor="start" font-size="12.5" font-weight="700" fill="#2558c4">Widget Sync+ : recopie</text><text x="804" y="261" text-anchor="start" font-size="12" font-weight="400" fill="#5f6b7e">(page ouverte)</text><text x="804" y="482" text-anchor="start" font-size="12" font-weight="400" fill="#5f6b7e">formules : automatique</text><path d="M380 132 L620 132" fill="none" stroke="#2f6fed" stroke-width="3"  marker-end="url(#ah)"/><text x="500" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#2558c4">A vers B</text><text x="500" y="115" text-anchor="middle" font-size="12" font-weight="400" fill="#5f6b7e">webhook de A</text><text x="500" y="159" text-anchor="middle" font-size="12" font-weight="400" fill="#5f6b7e">formulaire de B</text><path d="M620 578 L380 578" fill="none" stroke="#1a3f94" stroke-width="3"  marker-end="url(#ahd)"/><text x="500" y="544" text-anchor="middle" font-size="13" font-weight="700" fill="#1a3f94">B vers A</text><text x="500" y="561" text-anchor="middle" font-size="12" font-weight="400" fill="#5f6b7e">webhook de B</text><text x="500" y="605" text-anchor="middle" font-size="12" font-weight="400" fill="#5f6b7e">formulaire de A</text><text x="500" y="320" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5f6b7e">Chaque document a</text><text x="500" y="337" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5f6b7e">son propre webhook,</text><text x="500" y="354" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5f6b7e">son formulaire</text><text x="500" y="371" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5f6b7e">et son journal.</text><g><rect x="20" y="680" width="470" height="76" rx="9" fill="#ffffff" stroke="#c3cad6" stroke-width="1.4"/><text x="36" y="706" font-size="14.5" font-weight="700" fill="#1b2430">Qui l’emporte ?</text><text x="36" y="725" font-size="12.5" fill="#5f6b7e">• La modification la plus récente (MajLe) gagne.</text><text x="48" y="744" font-size="12.5" fill="#5f6b7e">Ce qui vient de l’autre document n’est pas renvoyé : pas d’écho.</text></g><g><rect x="510" y="680" width="470" height="76" rx="9" fill="#fdf3e1" stroke="#e0b45a" stroke-width="1.4"/><text x="526" y="706" font-size="14.5" font-weight="700" fill="#8a5300">Pour brancher : deux codes</text><text x="526" y="725" font-size="12.5" fill="#8a5300">• L’invitation de A (avec l’adresse de son formulaire de retour),</text><text x="538" y="744" font-size="12.5" fill="#8a5300">puis la réponse de B (avec celle du sien). Aucune donnée dedans.</text></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Liberation Sans", sans-serif'>
<title id="t">Suivre les mises à jour</title><desc id="d">On lit ce qui change dans le dépôt de référence, on relit le code, on reprend la nouvelle version sous ses trois modifications, on teste, puis on publie.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#2f6fed"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#b3261e"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#5f6b7e"/></marker></defs>
<rect width="1000" height="330" fill="#ffffff"/>
<rect x="20" y="20" width="960" height="290" rx="12" fill="#f4f6fa" stroke="#c3cad6" stroke-width="1.5"/><text x="38" y="48" font-size="17" font-weight="700" fill="#1b2430">Suivre les mises à jour, une version relue à la fois</text><text x="38" y="67" font-size="13" fill="#5f6b7e">Vos trois modifications sont dans un seul commit : elles se reposent seules sur la nouvelle version</text><rect x="36" y="80" width="166" height="112" rx="9" fill="#ffffff" stroke="#c3cad6" stroke-width="1.4"/><circle cx="60" cy="106" r="12.5" fill="#2f6fed"/><text x="60" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text><text x="82" y="111" font-size="15.5" font-weight="700" fill="#1b2430">Voir</text><text x="52" y="132" font-size="13" fill="#5f6b7e">git fetch amont</text><text x="52" y="151" font-size="13" fill="#5f6b7e">git log, git diff</text><text x="52" y="170" font-size="13" fill="#5f6b7e">sur amont/main</text><line x1="202" y1="136" x2="222" y2="136" stroke="#2f6fed" stroke-width="2.4" marker-end="url(#ah)"/><rect x="224" y="80" width="166" height="112" rx="9" fill="#e8f0fe" stroke="#2f6fed" stroke-width="2"/><circle cx="248" cy="106" r="12.5" fill="#2f6fed"/><text x="248" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text><text x="270" y="111" font-size="15.5" font-weight="700" fill="#1b2430">Relire</text><text x="240" y="132" font-size="13" fill="#5f6b7e">js/, i18n/, css/ et</text><text x="240" y="151" font-size="13" fill="#5f6b7e">index.html : le code</text><text x="240" y="170" font-size="13" fill="#5f6b7e">exécuté chez vous</text><line x1="390" y1="136" x2="410" y2="136" stroke="#2f6fed" stroke-width="2.4" marker-end="url(#ah)"/><rect x="412" y="80" width="166" height="112" rx="9" fill="#e8f0fe" stroke="#2f6fed" stroke-width="2"/><circle cx="436" cy="106" r="12.5" fill="#2f6fed"/><text x="436" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text><text x="458" y="111" font-size="15.5" font-weight="700" fill="#1b2430">Reprendre</text><text x="428" y="132" font-size="13" fill="#5f6b7e">git rebase</text><text x="428" y="151" font-size="13" fill="#5f6b7e">amont/main (vos 3</text><text x="428" y="170" font-size="13" fill="#5f6b7e">modifications suivent)</text><line x1="578" y1="136" x2="598" y2="136" stroke="#2f6fed" stroke-width="2.4" marker-end="url(#ah)"/><rect x="600" y="80" width="166" height="112" rx="9" fill="#e8f0fe" stroke="#2f6fed" stroke-width="2"/><circle cx="624" cy="106" r="12.5" fill="#2f6fed"/><text x="624" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text><text x="646" y="111" font-size="15.5" font-weight="700" fill="#1b2430">Tester</text><text x="616" y="132" font-size="13" fill="#5f6b7e">npm test, listes</text><text x="616" y="151" font-size="13" fill="#5f6b7e">d’instances comprises</text><line x1="766" y1="136" x2="786" y2="136" stroke="#2f6fed" stroke-width="2.4" marker-end="url(#ah)"/><rect x="788" y="80" width="166" height="112" rx="9" fill="#e8f0fe" stroke="#2f6fed" stroke-width="2"/><circle cx="812" cy="106" r="12.5" fill="#2f6fed"/><text x="812" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5</text><text x="834" y="111" font-size="15.5" font-weight="700" fill="#1b2430">Publier</text><text x="804" y="132" font-size="13" fill="#5f6b7e">étiquette, puis</text><text x="804" y="151" font-size="13" fill="#5f6b7e">publication de</text><text x="804" y="170" font-size="13" fill="#5f6b7e">la copie</text><rect x="36" y="212" width="912" height="82" rx="9" fill="#fcf1dc" stroke="#e0b45a" stroke-width="1.4"/><text x="52" y="243" font-size="15.5" font-weight="700" fill="#1b2430">Dans les documents</text><text x="52" y="264" font-size="13" fill="#8a5a00">Chaque document reprend la nouvelle version en rechargeant la page. Deux documents qui s’envoient des données</text><text x="52" y="283" font-size="13" fill="#8a5a00">doivent avoir la même version : le widget le dit (« L’autre document utilise la version … ») et refuse un code plus récent que lui.</text>
</svg>

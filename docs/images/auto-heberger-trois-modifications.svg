ight="700">avant</text><text x="110" y="238" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="11.8" fill="#5f6b7e" xml:space="preserve">script-src 'self' https://grist.numerique.gouv.fr/grist-plugin-api.js https://docs.getgrist.com/grist-plugin-api.js;</text><text x="110" y="260" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="11.8" fill="#5f6b7e" xml:space="preserve">connect-src 'self' https://grist.numerique.gouv.fr https://docs.getgrist.com;</text><rect x="40" y="284" width="920" height="54" rx="7" fill="#e8f0fe" stroke="#2f6fed" stroke-width="1.4"/><text x="52" y="300" text-anchor="start" font-size="11.5" fill="#1a3f94" font-weight="700">après</text><text x="110" y="300" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="11.8" fill="#1b2430" xml:space="preserve">script-src 'self' <tspan font-weight="700" fill="#1a3f94">https://grist.exemple.org</tspan>/grist-plugin-api.js;</text><text x="110" y="322" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="11.8" fill="#1b2430" xml:space="preserve">connect-src 'self' <tspan font-weight="700" fill="#1a3f94">https://grist.exemple.org</tspan>;</text><rect x="20" y="368" width="960" height="138" rx="12" fill="#f4f6fa" stroke="#c3cad6" stroke-width="1.5"/><circle cx="46" cy="398" r="12.5" fill="#2f6fed"/><text x="46" y="403" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text><text x="70" y="403" font-size="16" font-weight="700" fill="#1b2430">js/config.js</text><text x="187.60000000000002" y="403" text-anchor="start" font-size="14" fill="#5f6b7e">: l’adresse que donnent les consignes (WIDGET_URL)</text><rect x="40" y="418" width="920" height="32" rx="7" fill="#eef1f6"/><text x="52" y="434" text-anchor="start" font-size="11.5" fill="#5f6b7e" font-weight="700">avant</text><text x="110" y="434" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="11.8" fill="#5f6b7e" xml:space="preserve">const WIDGET_URL = 'https://grist-factory.github.io/grist-widget-syncPlus/';</text><rect x="40" y="458" width="920" height="32" rx="7" fill="#e8f0fe" stroke="#2f6fed" stroke-width="1.4"/><text x="52" y="474" text-anchor="start" font-size="11.5" fill="#1a3f94" font-weight="700">après</text><text x="110" y="474" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace' font-size="11.8" fill="#1b2430" xml:space="preserve">const WIDGET_URL = '<tspan font-weight="700" fill="#1a3f94">https://widgets.exemple.org/syncplus/</tspan>';</text><text x="500" y="534" text-anchor="middle" font-size="13.5" fill="#5f6b7e">Exemple avec une instance « grist.exemple.org » et un hébergement « widgets.exemple.org ». Rien d’autre ne change.</text>

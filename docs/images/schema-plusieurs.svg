<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Liberation Sans", sans-serif'>
<title id="t">Échange à plusieurs</title><desc id="d">Le document A administre un Échange avec deux participants B et C : chacun a son journal de retour chez A ; A applique ses règles puis relaie à chacun ce que l’autre a envoyé.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#2f6fed"/></marker>
<marker id="ahd" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#1a3f94"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#5f6b7e"/></marker>
</defs>
<rect width="1100" height="700" fill="#ffffff"/>
<g><rect x="20" y="28" width="270" height="552" rx="12" fill="#f4f6fa" stroke="#c3cad6" stroke-width="1.5"/>
<text x="38" y="56" font-size="17" font-weight="700" fill="#1b2430">Participant B</text>
<text x="38" y="75" font-size="13" fill="#5f6b7e">son propre widget Sync+</text></g><g><rect x="36" y="90" width="238" height="80" rx="9" fill="#eef1f6" stroke="#c3cad6" stroke-width="1.4"/><text x="52" y="120" font-size="14.5" font-weight="700" fill="#1b2430">Table Synchro + webhook</text><text x="52" y="139" font-size="13" fill="#5f6b7e">envoie à A ce qui change</text><text x="52" y="158" font-size="13" fill="#5f6b7e">dans B</text></g><g><rect x="36" y="270" width="238" height="80" rx="9" fill="#ffffff" stroke="#c3cad6" stroke-width="1.4"/><text x="52" y="300" font-size="14.5" font-weight="700" fill="#1b2430">Ses tables partagées</text><text x="52" y="319" font-size="13" fill="#5f6b7e">les mêmes que celles de A</text></g><g><rect x="36" y="440" width="238" height="100" rx="9" fill="#eef1f6" stroke="#c3cad6" stroke-width="1.4"/><text x="52" y="470" font-size="14.5" font-weight="700" fill="#1b2430">Formulaire + Journal</text><text x="52" y="489" font-size="13" fill="#5f6b7e">reçoit ce que A envoie</text><text x="52" y="508" font-size="13" fill="#5f6b7e">(ses lignes et celles des</text><text x="52" y="527" font-size="13" fill="#5f6b7e">autres participants)</text></g><path d="M155 440 L155 350" fill="none" stroke="#2f6fed" stroke-width="2.5"  marker-end="url(#ah)"/><path d="M155 270 L155 170" fill="none" stroke="#2f6fed" stroke-width="2.5"  marker-end="url(#ah)"/><text x="167" y="400" text-anchor="start" font-size="12" font-weight="700" fill="#2558c4">widget : recopie</text><text x="167" y="225" text-anchor="start" font-size="12" font-weight="400" fill="#5f6b7e">formules</text><g><rect x="810" y="28" width="270" height="552" rx="12" fill="#f4f6fa" stroke="#c3cad6" stroke-width="1.5"/>
<text x="828" y="56" font-size="17" font-weight="700" fill="#1b2430">Participant C</text>
<text x="828" y="75" font-size="13" fill="#5f6b7e">son propre widget Sync+</text></g><g><rect x="826" y="90" width="238" height="80" rx="9" fill="#eef1f6" stroke="#c3cad6" stroke-width="1.4"/><text x="842" y="120" font-size="14.5" font-weight="700" fill="#1b2430">Table Synchro + webhook</text><text x="842" y="139" font-size="13" fill="#5f6b7e">envoie à A ce qui change</text><text x="842" y="158" font-size="13" fill="#5f6b7e">dans C</text></g><g><rect x="826" y="270" width="238" height="80" rx="9" fill="#ffffff" stroke="#c3cad6" stroke-width="1.4"/><text x="842" y="300" font-size="14.5" font-weight="700" fill="#1b2430">Ses tables partagées</text><text x="842" y="319" font-size="13" fill="#5f6b7e">les mêmes que celles de A</text></g><g><rect x="826" y="440" width="238" height="100" rx="9" fill="#eef1f6" stroke="#c3cad6" stroke-width="1.4"/><text x="842" y="470" font-size="14.5" font-weight="700" fill="#1b2430">Formulaire + Journal</text><text x="842" y="489" font-size="13" fill="#5f6b7e">reçoit ce que A envoie</text><text x="842" y="508" font-size="13" fill="#5f6b7e">(ses lignes et celles des</text><text x="842" y="527" font-size="13" fill="#5f6b7e">autres participants)</text></g><path d="M945 440 L945 350" fill="none" stroke="#2f6fed" stroke-width="2.5"  marker-end="url(#ah)"/><path d="M945 270 L945 170" fill="none" stroke="#2f6fed" stroke-width="2.5"  marker-end="url(#ah)"/><text x="957" y="400" text-anchor="start" font-size="12" font-weight="700" fill="#2558c4">widget : recopie</text><text x="957" y="225" text-anchor="start" font-size="12" font-weight="400" fill="#5f6b7e">formules</text><g><rect x="360" y="28" width="380" height="552" rx="12" fill="#f4f6fa" stroke="#c3cad6" stroke-width="1.5"/>
<text x="378" y="56" font-size="17" font-weight="700" fill="#1b2430">Document A</text>
<text x="378" y="75" font-size="13" fill="#5f6b7e">celui qui administre l’Échange</text></g><g><rect x="380" y="90" width="340" height="80" rx="9" fill="#eef1f6" stroke="#c3cad6" stroke-width="1.4"/><text x="396" y="120" font-size="14.5" font-weight="700" fill="#1b2430">Un journal de retour par participant</text><text x="396" y="139" font-size="13" fill="#5f6b7e">un formulaire publié chez A pour B,</text><text x="396" y="158" font-size="13" fill="#5f6b7e">un autre pour C</text></g><path d="M550 170 L550 200" fill="none" stroke="#2f6fed" stroke-width="2.5"  marker-end="url(#ah)"/><g><rect x="380" y="200" width="340" height="112" rx="9" fill="#e8f0fe" stroke="#2f6fed" stroke-width="1.8"/><text x="396" y="230" font-size="14.5" font-weight="700" fill="#1b2430">Widget Sync+ de A (page ouverte)</text><text x="396" y="249" font-size="13" fill="#5f6b7e">pour chaque ajout, modification ou</text><text x="396" y="268" font-size="13" fill="#5f6b7e">suppression reçu, selon les règles de A :</text><text x="396" y="287" font-size="13" fill="#5f6b7e">accepter, refuser ou mettre « à valider »</text></g><path d="M550 312 L550 342" fill="none" stroke="#2f6fed" stroke-width="2.5"  marker-end="url(#ah)"/><g><rect x="380" y="342" width="340" height="82" rx="9" fill="#ffffff" stroke="#c3cad6" stroke-width="1.4"/><text x="396" y="372" font-size="15.5" font-weight="700" fill="#1b2430">Tables partagées</text><text x="396" y="391" font-size="13" fill="#5f6b7e">la modification la plus récente gagne</text></g><path d="M550 424 L550 450" fill="none" stroke="#2f6fed" stroke-width="2.5"  marker-end="url(#ah)"/><g><rect x="380" y="450" width="340" height="100" rx="9" fill="#eef1f6" stroke="#c3cad6" stroke-width="1.4"/><text x="396" y="480" font-size="14" font-weight="700" fill="#1b2430">Table Synchro + un webhook par participant</text><text x="396" y="499" font-size="13" fill="#5f6b7e">le même lot part vers B et vers C :</text><text x="396" y="518" font-size="13" fill="#5f6b7e">A relaie à chacun ce que l’autre a envoyé</text></g><path d="M274 130 L380 130" fill="none" stroke="#2f6fed" stroke-width="3"  marker-end="url(#ah)"/><path d="M826 130 L720 130" fill="none" stroke="#2f6fed" stroke-width="3"  marker-end="url(#ah)"/><text x="327" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#2558c4">B envoie</text><text x="773" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#2558c4">C envoie</text><path d="M380 490 L274 490" fill="none" stroke="#1a3f94" stroke-width="3"  marker-end="url(#ahd)"/><path d="M720 490 L826 490" fill="none" stroke="#1a3f94" stroke-width="3"  marker-end="url(#ahd)"/><text x="327" y="478" text-anchor="middle" font-size="12" font-weight="700" fill="#1a3f94">A envoie</text><text x="773" y="478" text-anchor="middle" font-size="12" font-weight="700" fill="#1a3f94">A envoie</text><g><rect x="20" y="600" width="1060" height="80" rx="9" fill="#fdf3e1" stroke="#e0b45a" stroke-width="1.4"/><text x="36" y="626" font-size="14.5" font-weight="700" fill="#8a5300">Ce qu’il faut retenir</text><text x="36" y="645" font-size="12.5" fill="#8a5300">• B et C ne se connaissent pas : tout passe par A, qui relaie. Chaque participant a sa propre clé de signature et son journal de retour,</text><text x="48" y="664" font-size="12.5" fill="#8a5300">et A peut retirer l’un d’eux sans toucher aux autres. Le relais demande la page du widget ouverte chez A : c’est lui qui recopie, puis renvoie.</text></g>
</svg>

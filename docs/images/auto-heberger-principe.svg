<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Liberation Sans", sans-serif'>
<title id="t">Héberger sa propre copie du widget</title><desc id="d">Du dépôt de référence à votre copie modifiée, publiée en https, puis ajoutée dans Grist ; l’administrateur autorise les webhooks de l’instance vers elle-même.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#2f6fed"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#b3261e"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#5f6b7e"/></marker></defs>
<rect width="1000" height="430" fill="#ffffff"/>
<rect x="20" y="20" width="960" height="350" rx="12" fill="#f4f6fa" stroke="#c3cad6" stroke-width="1.5"/><text x="38" y="48" font-size="17" font-weight="700" fill="#1b2430">Le parcours, de la copie au document</text><text x="38" y="67" font-size="13" fill="#5f6b7e">Rien de ce qui suit ne se configure dans le widget : tout est dans votre copie et dans les réglages de votre instance</text><rect x="40" y="80" width="180" height="112" rx="9" fill="#ffffff" stroke="#c3cad6" stroke-width="1.4"/><text x="56" y="111" font-size="15.5" font-weight="700" fill="#1b2430">Dépôt de référence</text><text x="56" y="132" font-size="13" fill="#5f6b7e">GitHub, code lisible,</text><text x="56" y="151" font-size="13" fill="#5f6b7e">sans dépendance</text><text x="56" y="170" font-size="13" fill="#5f6b7e">ni étape de build</text><rect x="270" y="80" width="190" height="112" rx="9" fill="#e8f0fe" stroke="#2f6fed" stroke-width="2"/><circle cx="294" cy="106" r="12.5" fill="#2f6fed"/><text x="294" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text><text x="316" y="111" font-size="15.5" font-weight="700" fill="#1b2430">Votre copie</text><text x="286" y="132" font-size="13" fill="#5f6b7e">fork ou copie interne,</text><text x="286" y="151" font-size="13" fill="#5f6b7e">fixée sur un commit relu,</text><text x="286" y="170" font-size="13" fill="#5f6b7e">plus 3 modifications</text><rect x="510" y="80" width="190" height="112" rx="9" fill="#e8f0fe" stroke="#2f6fed" stroke-width="2"/><circle cx="534" cy="106" r="12.5" fill="#2f6fed"/><text x="534" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text><text x="556" y="111" font-size="15.5" font-weight="700" fill="#1b2430">Hébergement</text><text x="526" y="132" font-size="13" fill="#5f6b7e">GitHub Pages ou serveur</text><text x="526" y="151" font-size="13" fill="#5f6b7e">interne, en https :</text><text x="526" y="170" font-size="13" fill="#5f6b7e">des fichiers statiques</text><line x1="220" y1="136" x2="268" y2="136" stroke="#2f6fed" stroke-width="2.4" marker-end="url(#ah)"/><line x1="460" y1="136" x2="508" y2="136" stroke="#2f6fed" stroke-width="2.4" marker-end="url(#ah)"/><line x1="700" y1="136" x2="748" y2="136" stroke="#2f6fed" stroke-width="2.4" marker-end="url(#ah)"/><text x="244" y="124" text-anchor="middle" font-size="12" fill="#5f6b7e">copier</text><text x="484" y="124" text-anchor="middle" font-size="12" fill="#5f6b7e">publier</text><text x="724" y="124" text-anchor="middle" font-size="12" fill="#5f6b7e">URL</text><rect x="750" y="66" width="214" height="288" rx="10" fill="#fff" stroke="#c3cad6" stroke-width="1.5" stroke-dasharray="6 5"/><text x="857" y="90" text-anchor="middle" font-size="14" fill="#1b2430" font-weight="700">Votre instance Grist</text><rect x="762" y="104" width="190" height="112" rx="9" fill="#e8f0fe" stroke="#2f6fed" stroke-width="2"/><circle cx="786" cy="130" r="12.5" fill="#2f6fed"/><text x="786" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text><text x="808" y="135" font-size="15.5" font-weight="700" fill="#1b2430">Ajouter le widget</text><text x="778" y="156" font-size="13" fill="#5f6b7e">URL personnalisée</text><text x="778" y="175" font-size="13" fill="#5f6b7e">(chaque personne)</text><text x="778" y="194" font-size="13" fill="#5f6b7e">ou galerie (admin)</text><rect x="762" y="224" width="190" height="112" rx="9" fill="#eef1f6" stroke="#c3cad6" stroke-width="1.4"/><circle cx="786" cy="250" r="12.5" fill="#2f6fed"/><text x="786" y="255" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text><text x="808" y="255" font-size="15.5" font-weight="700" fill="#1b2430">Webhooks</text><text x="778" y="276" font-size="13" fill="#5f6b7e">ALLOWED_WEBHOOK_</text><text x="778" y="295" font-size="13" fill="#5f6b7e">DOMAINS, réglé par</text><text x="778" y="314" font-size="13" fill="#5f6b7e">l’administrateur</text><rect x="40" y="212" width="680" height="108" rx="9" fill="#fcf1dc" stroke="#e0b45a" stroke-width="1.4"/><text x="56" y="243" font-size="15.5" font-weight="700" fill="#1b2430">À savoir</text><text x="56" y="264" font-size="13" fill="#8a5a00">Aucune donnée ne passe par votre hébergement : le navigateur y télécharge le code du widget,</text><text x="56" y="283" font-size="13" fill="#8a5a00">puis ne parle plus qu’à votre instance.</text><text x="56" y="302" font-size="13" fill="#8a5a00">Une copie est une version relue : vous décidez quand elle change (voir « Suivre les mises à jour »).</text><rect x="40" y="386" width="34" height="20" rx="5" fill="#e8f0fe" stroke="#2f6fed" stroke-width="1.4"/><text x="86" y="401" text-anchor="start" font-size="13.5" fill="#1b2430">ce que vous faites</text><rect x="330" y="386" width="34" height="20" rx="5" fill="#eef1f6" stroke="#c3cad6" stroke-width="1.4"/><text x="376" y="401" text-anchor="start" font-size="13.5" fill="#1b2430">ce que fait l’administrateur de l’instance</text><rect x="720" y="386" width="34" height="20" rx="5" fill="#ffffff" stroke="#c3cad6" stroke-width="1.4"/><text x="766" y="401" text-anchor="start" font-size="13.5" fill="#1b2430">ce qui existe déjà</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Liberation Sans", sans-serif'>
<title id="t">Deux verrous : le code et le navigateur</title><desc id="d">Chaque requête du widget doit passer deux contrôles, la liste GRIST_ORIGINS de js/config.js puis la politique de sécurité de index.html, avant d’atteindre l’instance Grist.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#2f6fed"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#b3261e"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#5f6b7e"/></marker></defs>
<rect width="1000" height="450" fill="#ffffff"/>
<rect x="20" y="20" width="960" height="410" rx="12" fill="#f4f6fa" stroke="#c3cad6" stroke-width="1.5"/><text x="38" y="48" font-size="17" font-weight="700" fill="#1b2430">Pourquoi la liste des instances est écrite en deux endroits</text><text x="38" y="67" font-size="13" fill="#5f6b7e">Une requête du widget ne part que si le code et le navigateur sont d’accord, et ni l’un ni l’autre ne lit un réglage venu de la page ou d’un lien</text><rect x="40" y="92" width="150" height="118" rx="9" fill="#ffffff" stroke="#c3cad6" stroke-width="1.4"/><text x="56" y="123" font-size="15.5" font-weight="700" fill="#1b2430">Le widget</text><text x="56" y="144" font-size="13" fill="#5f6b7e">votre copie, dans</text><text x="56" y="163" font-size="13" fill="#5f6b7e">un cadre de Grist</text><rect x="240" y="92" width="250" height="118" rx="9" fill="#e8f0fe" stroke="#2f6fed" stroke-width="2"/><circle cx="264" cy="118" r="12.5" fill="#2f6fed"/><text x="264" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text><text x="286" y="123" font-size="15.5" font-weight="700" fill="#1b2430">Le code</text><text x="256" y="144" font-size="13" fill="#5f6b7e">js/config.js : GRIST_ORIGINS</text><text x="256" y="163" font-size="13" fill="#5f6b7e">gristFetch refuse toute adresse</text><text x="256" y="182" font-size="13" fill="#5f6b7e">hors de la liste, et n’envoie</text><text x="256" y="201" font-size="13" fill="#5f6b7e">jamais de cookie</text><rect x="540" y="92" width="250" height="118" rx="9" fill="#e8f0fe" stroke="#2f6fed" stroke-width="2"/><circle cx="564" cy="118" r="12.5" fill="#2f6fed"/><text x="564" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text><text x="586" y="123" font-size="15.5" font-weight="700" fill="#1b2430">Le navigateur</text><text x="556" y="144" font-size="13" fill="#5f6b7e">index.html : politique de</text><text x="556" y="163" font-size="13" fill="#5f6b7e">sécurité (script-src, connect-src)</text><text x="556" y="182" font-size="13" fill="#5f6b7e">ne laisse sortir le widget que</text><text x="556" y="201" font-size="13" fill="#5f6b7e">vers les mêmes instances</text><rect x="840" y="92" width="120" height="118" rx="9" fill="#eef1f6" stroke="#c3cad6" stroke-width="1.4"/><text x="856" y="123" font-size="15.5" font-weight="700" fill="#1b2430">Instance</text><text x="856" y="144" font-size="13" fill="#5f6b7e">votre Grist</text><line x1="190" y1="151" x2="238" y2="151" stroke="#2f6fed" stroke-width="2.4" marker-end="url(#ah)"/><line x1="490" y1="151" x2="538" y2="151" stroke="#2f6fed" stroke-width="2.4" marker-end="url(#ah)"/><line x1="790" y1="151" x2="838" y2="151" stroke="#2f6fed" stroke-width="2.4" marker-end="url(#ah)"/><text x="214" y="140" text-anchor="middle" font-size="11.5" fill="#5f6b7e">liste ?</text><text x="514" y="140" text-anchor="middle" font-size="11.5" fill="#5f6b7e">liste ?</text><text x="814" y="140" text-anchor="middle" font-size="11.5" fill="#5f6b7e">ok</text><rect x="240" y="262" width="250" height="64" rx="9" fill="#fdecea" stroke="#b3261e" stroke-width="1.4"/><text x="256" y="288" text-anchor="start" font-size="14.5" fill="#b3261e" font-weight="700">Autre adresse : refusée</text><text x="256" y="309" text-anchor="start" font-size="12.5" fill="#b3261e">erreur « autre instance »</text><rect x="540" y="262" width="250" height="64" rx="9" fill="#fdecea" stroke="#b3261e" stroke-width="1.4"/><text x="556" y="288" text-anchor="start" font-size="14.5" fill="#b3261e" font-weight="700">Autre adresse : bloquée</text><text x="556" y="309" text-anchor="start" font-size="12.5" fill="#b3261e">erreur réseau dans la console</text><line x1="365" y1="210" x2="365" y2="260" stroke="#b3261e" stroke-width="2.4" marker-end="url(#ar)"/><line x1="665" y1="210" x2="665" y2="260" stroke="#b3261e" stroke-width="2.4" marker-end="url(#ar)"/><rect x="40" y="344" width="920" height="66" rx="9" fill="#fcf1dc" stroke="#e0b45a" stroke-width="1.4"/><text x="56" y="375" font-size="15.5" font-weight="700" fill="#1b2430">Les deux listes disent la même chose</text><text x="56" y="396" font-size="13" fill="#8a5a00">npm test le vérifie : une instance ajoutée à l’une et oubliée dans l’autre fait échouer l’essai de cohérence (tests/unit/instances.test.mjs).</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790" width="1000" height="790" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Liberation Sans", sans-serif'>
<title id="t">Synchro dans un seul sens</title><desc id="d">La SOURCE envoie les lignes modifiées par un webhook Grist vers le formulaire publié de la CIBLE, qui les dépose dans un journal ; le widget de la CIBLE les recopie dans les tables de destination.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#2f6fed"/></marker>
<marker id="ahd" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#1a3f94"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#5f6b7e"/></marker>
</defs>
<rect width="1000" height="790" fill="#ffffff"/>
<rect x="360" y="20" width="280" height="740" fill="#eef1f6" opacity=".55"/><text x="500" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#5f6b7e">Même instance Grist</text><text x="500" y="71" text-anchor="middle" font-size="12" font-weight="400" fill="#5f6b7e">Elle transporte les lignes,</text><text x="500" y="87" text-anchor="middle" font-size="12" font-weight="400" fill="#5f6b7e">documents ouverts ou non</text><g><rect x="20" y="20" width="340" height="424" rx="12" fill="#f4f6fa" stroke="#c3cad6" stroke-width="1.5"/>
<text x="38" y="48" font-size="17" font-weight="700" fill="#1b2430">Document SOURCE</text>
<text x="38" y="67" font-size="13" fill="#5f6b7e">un propriétaire, le widget Sync+ posé</text></g><g><rect x="40" y="80" width="300" height="82" rx="9" fill="#ffffff" stroke="#c3cad6" stroke-width="1.4"/><circle cx="64" cy="106" r="12.5" fill="#2f6fed"/><text x="64" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text><text x="86" y="110" font-size="15.5" font-weight="700" fill="#1b2430">Vos tables partagées</text><text x="86" y="129" font-size="13" fill="#5f6b7e">colonnes choisies ; le widget y ajoute</text><text x="86" y="148" font-size="13" fill="#5f6b7e">id_sync (clé) et MajLe (heure)</text></g><path d="M190 162 L190 196" fill="none" stroke="#2f6fed" stroke-width="2.5"  marker-end="url(#ah)"/><g><rect x="40" y="196" width="300" height="108" rx="9" fill="#eef1f6" stroke="#c3cad6" stroke-width="1.4"/><circle cx="64" cy="222" r="12.5" fill="#2f6fed"/><text x="64" y="227" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text><text x="86" y="226" font-size="15.5" font-weight="700" fill="#1b2430">Table technique « Synchro »</text><text x="86" y="245" font-size="13" fill="#5f6b7e">formules posées par le widget : elles</text><text x="86" y="264" font-size="13" fill="#5f6b7e">préparent les lignes modifiées,</text><text x="86" y="283" font-size="13" fill="#5f6b7e">signées pour chaque destinataire</text></g><path d="M190 304 L190 322" fill="none" stroke="#2f6fed" stroke-width="2.5"  marker-end="url(#ah)"/><g><rect x="40" y="322" width="300" height="82" rx="9" fill="#eef1f6" stroke="#c3cad6" stroke-width="1.4"/><circle cx="64" cy="348" r="12.5" fill="#2f6fed"/><text x="64" y="353" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text><text x="86" y="352" font-size="15.5" font-weight="700" fill="#1b2430">Webhook (un par destinataire)</text><text x="86" y="371" font-size="13" fill="#5f6b7e">créé par le widget ; part tout seul</text><text x="86" y="390" font-size="13" fill="#5f6b7e">à chaque ajout ou modification</text></g><path d="M340 363 L660 363" fill="none" stroke="#2f6fed" stroke-width="3"  marker-end="url(#ah)"/><text x="500" y="336" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2430">Envoi d’une ligne, en JSON</text><text x="500" y="353" text-anchor="middle" font-size="12" font-weight="400" fill="#5f6b7e">environ 1 seconde</text><text x="500" y="386" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2430" font-family='ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace'>…/api/s/‹clé du formulaire›/</text><text x="500" y="401" text-anchor="middle" font-size="11" font-weight="400" fill="#1b2430" font-family='ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace'>tables/Journal_…/records?flat=1</text><text x="500" y="419" text-anchor="middle" font-size="12" font-weight="400" fill="#5f6b7e">sans compte : la clé suffit</text><g><rect x="640" y="232" width="340" height="528" rx="12" fill="#f4f6fa" stroke="#c3cad6" stroke-width="1.5"/>
<text x="658" y="260" font-size="17" font-weight="700" fill="#1b2430">Document CIBLE</text>
<text x="658" y="279" font-size="13" fill="#5f6b7e">un éditeur, le widget Sync+ posé</text></g><g><rect x="660" y="308" width="300" height="110" rx="9" fill="#eef1f6" stroke="#c3cad6" stroke-width="1.4"/><circle cx="684" cy="334" r="12.5" fill="#2f6fed"/><text x="684" y="339" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text><text x="706" y="338" font-size="15.5" font-weight="700" fill="#1b2430">Formulaire publié</text><text x="706" y="357" font-size="13" fill="#5f6b7e">sur la table Journal, sur sa propre page.</text><text x="706" y="376" font-size="13" fill="#5f6b7e">Sa clé de partage permet d’ajouter des</text><text x="706" y="395" font-size="13" fill="#5f6b7e">lignes, rien d’autre (ni lire, ni modifier).</text></g><path d="M810 418 L810 446" fill="none" stroke="#2f6fed" stroke-width="2.5"  marker-end="url(#ah)"/><g><rect x="660" y="446" width="300" height="82" rx="9" fill="#eef1f6" stroke="#c3cad6" stroke-width="1.4"/><circle cx="684" cy="472" r="12.5" fill="#2f6fed"/><text x="684" y="477" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5</text><text x="706" y="476" font-size="15.5" font-weight="700" fill="#1b2430">Table « Journal_… »</text><text x="706" y="495" font-size="13" fill="#5f6b7e">les lignes brutes s’accumulent ici,</text><text x="706" y="514" font-size="13" fill="#5f6b7e">même si personne n’a la page ouverte</text></g><path d="M810 528 L810 556" fill="none" stroke="#2f6fed" stroke-width="2.5"  marker-end="url(#ah)"/><g><rect x="660" y="556" width="300" height="100" rx="9" fill="#e8f0fe" stroke="#2f6fed" stroke-width="1.8"/><circle cx="684" cy="582" r="12.5" fill="#2f6fed"/><text x="684" y="587" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">6</text><text x="706" y="586" font-size="15.5" font-weight="700" fill="#1b2430">Widget Sync+ (page ouverte)</text><text x="706" y="605" font-size="13" fill="#5f6b7e">toutes les 10 s : vérifie la signature,</text><text x="706" y="624" font-size="13" fill="#5f6b7e">garde la version la plus récente,</text><text x="706" y="643" font-size="13" fill="#5f6b7e">recopie, puis nettoie le journal</text></g><path d="M810 656 L810 678" fill="none" stroke="#2f6fed" stroke-width="2.5"  marker-end="url(#ah)"/><g><rect x="660" y="678" width="300" height="62" rx="9" fill="#ffffff" stroke="#c3cad6" stroke-width="1.4"/><circle cx="684" cy="704" r="12.5" fill="#2f6fed"/><text x="684" y="709" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">7</text><text x="706" y="708" font-size="15.5" font-weight="700" fill="#1b2430">Vos tables de destination</text><text x="706" y="727" font-size="13" fill="#5f6b7e">tables normales, éditables</text></g><text x="660" y="52" text-anchor="start" font-size="14" font-weight="700" fill="#1b2430">Légende</text><rect x="660" y="70" width="26" height="18" rx="4" fill="#ffffff" stroke="#c3cad6" stroke-width="1.4"/>
<text x="698" y="84" font-size="13" fill="#1b2430">Vos tables</text><rect x="660" y="100" width="26" height="18" rx="4" fill="#eef1f6" stroke="#c3cad6" stroke-width="1.4"/>
<text x="698" y="114" font-size="13" fill="#1b2430">Mécanismes natifs de Grist (rien à héberger)</text><rect x="660" y="130" width="26" height="18" rx="4" fill="#e8f0fe" stroke="#2f6fed" stroke-width="1.4"/>
<text x="698" y="144" font-size="13" fill="#1b2430">Ce que fait le widget Sync+</text><text x="660" y="180" text-anchor="start" font-size="13" font-weight="400" fill="#5f6b7e">Dans un seul sens : la CIBLE ne</text><text x="660" y="198" text-anchor="start" font-size="13" font-weight="400" fill="#5f6b7e">modifie jamais la SOURCE.</text><g><rect x="20" y="498" width="340" height="262" rx="9" fill="#fdf3e1" stroke="#e0b45a" stroke-width="1.4"/><text x="36" y="524" font-size="14.5" font-weight="700" fill="#8a5300">À savoir</text><text x="36" y="543" font-size="12.5" fill="#8a5300">• Le webhook part tout seul : le widget</text><text x="48" y="562" font-size="12.5" fill="#8a5300">SOURCE n’a pas besoin d’être ouvert.</text><text x="36" y="584" font-size="12.5" fill="#8a5300">• Le formulaire est dans la CIBLE, pas</text><text x="48" y="603" font-size="12.5" fill="#8a5300">dans la SOURCE. Son lien est un droit</text><text x="48" y="622" font-size="12.5" fill="#8a5300">d’écriture : ne le diffusez pas.</text><text x="36" y="644" font-size="12.5" fill="#8a5300">• Seul le widget de la CIBLE écrit dans</text><text x="48" y="663" font-size="12.5" fill="#8a5300">les tables de destination, page ouverte.</text><text x="48" y="682" font-size="12.5" fill="#8a5300">Sinon les lignes attendent dans le journal.</text><text x="36" y="704" font-size="12.5" fill="#8a5300">• Aucune donnée dans les deux codes</text><text x="48" y="723" font-size="12.5" fill="#8a5300">échangés pour brancher : noms de tables,</text><text x="48" y="742" font-size="12.5" fill="#8a5300">adresse d’écriture, clé publique.</text></g>
</svg>
